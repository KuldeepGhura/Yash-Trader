<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Successful | Yash Traders</title>

    <link rel="stylesheet" href="success.css">
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>

    <section class="success-container">
        <div class="success-card">

            <div class="success-icon">
                <i class="fa-solid fa-circle-check"></i>
            </div>

            <h1>Order Placed Successfully!</h1>

            <p class="message">
                Thank you for shopping with <strong>Yash Traders.</strong><br>
                Your order has been confirmed and is being prepared.
            </p>

            <div class="order-details">

                <div class="detail-row">
                    <span>Order ID</span>
                    <span id="order-id"></span>
                </div>

                <div class="detail-row">
                    <span>Estimated Delivery</span>

                    <div class="delivery-info">
                        <span id="delivery-day"></span><br>
                        <small id="delivery-time"></small>
                    </div>
                </div>

                <div class="detail-row">
                    <span>Payment</span>
                    <span id="payment-method"></span>
                </div>

                <div class="detail-row">
                    <span>Total Paid</span>
                    <span id="total-paid"></span>
                </div>
            </div>

            <button class="btn-home" id="continue-shopping">
                <i class="fa-solid fa-house"></i>
                Continue Shopping
            </button>

            <button class="btn-order">
                <i class="fa-solid fa-bag-shopping"></i>
                View Orders
            </button>
        </div>
    </section>

<script src="success.js"></script>
</body>
</html>
